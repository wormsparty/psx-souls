[package]
name = "psx-souls"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
default-run = "psx-souls"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "default_app",
    "default_platform",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "scene",
    "audio",
    "wav",
    "keyboard",
    "mouse",
    "gamepad",
    # Deterministic maths (glam via libm): essential for future rollback.
    "libm",
] }
serde = { version = "1", features = ["derive"] }
ron = "0.11"
serde_json = "1"
libm = "0.2"
thiserror = "2"
# Co-op: rollback (GGRS) over peer-to-peer WebRTC (matchbox), the same on native and in the browser.
ggrs = { version = "0.13", features = ["sync-send"] }
matchbox_socket = "0.14"
bincode = "1.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# matchbox's WebRTC (webrtc-rs) runs on tokio.
async-compat = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
# ggrs draws its random numbers through getrandom 0.2.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
ggrs = { version = "0.13", features = ["sync-send", "wasm-bindgen"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Element", "Location", "EventTarget", "MouseEvent", "Navigator", "Worker", "Blob", "BlobPropertyBag", "Url"] }

[features]
# `cargo run --features dev`: hot reload of assets/configs and dynamic linking (native only).
dev = ["bevy/file_watcher", "bevy/dynamic_linking"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = true
lto = "fat"
panic = "abort"
